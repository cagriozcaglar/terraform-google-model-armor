apiVersion: blueprints.cloud.google.com/v1alpha1
kind: TerraformBlueprint
metadata:
  name: terraform-google-model-armor-template
  annotations:
    blueprints.cloud.google.com/title: "Google Cloud Model Armor Template"
    blueprints.cloud.google.com/source: "https://github.com/GoogleCloudPlatform/terraform-google-model-armor-template"
spec:
  info:
    title: Model Armor Template
    source:
      type: git
      location: https://github.com/GoogleCloudPlatform/terraform-google-model-armor-template.git
    version: 0.1.0
    actuationTool:
      flavor: Terraform
      version: ">= 1.3"
    descriptions:
      tagline: A Terraform module to create and manage a Google Cloud Model Armor Template for Vertex AI.
      detailed: This module handles the creation of a Model Armor Template, allowing for the configuration of various security filters like Malicious URI, Prompt Injection, Responsible AI, and Sensitive Data Protection.
    examples:
      - name: simple_template
        location: examples/simple_template
    labels:
      gcp:
      category: ai_ml
      service: vertex_ai
    documentations:
      - title: Terraform Provider Documentation
        url: https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/model_armor_template
  interfaces:
    standalone: true
  customization:
    variables:
      - name: project_id
        description: The ID of the project in which the Model Armor Template will be created. If not provided, the provider project will be used.
        type: string
        required: false
        default: null
      - name: location
        description: The location for the Model Armor Template. It identifies the resource within its parent collection.
        type: string
        required: false
        default: "us-central1"
      - name: template_id
        description: The user-provided ID of the Model Armor Template.
        type: string
        required: false
        default: "example-model-armor-template"
      - name: labels
        description: A map of labels to apply to the Model Armor Template.
        type: map(string)
        required: false
        default: {}
      - name: filter_config
        description: Configuration for the filters to be applied by the template. This block is required.
        type: object
        required: false
        default:
          malicious_uri_filter_settings:
            filter_enforcement: "DISABLED"
          pi_and_jailbreak_filter_settings:
            filter_enforcement: "DISABLED"
      - name: template_metadata
        description: Optional metadata for the Model Armor Template.
        type: object
        required: false
        default: null
    variableGroups:
      - title: Basic Configuration
        variables:
          - project_id
          - location
          - template_id
          - labels
      - title: Security Filters
        variables:
          - filter_config
      - title: Advanced Metadata
        variables:
          - template_metadata
    outputs:
      - name: name
        description: The full resource name of the Model Armor Template.
      - name: id
        description: The unique identifier for the Model Armor Template, in the format projects/{{project}}/locations/{{location}}/templates/{{template_id}}.
      - name: create_time
        description: The creation timestamp of the Model Armor Template.
      - name: update_time
        description: The last update timestamp of the Model Armor Template.
  requirements:
    services:
      - aiplatform.googleapis.com
    roles:
      - level: project
        roles:
          - roles/aiplatform.admin
    permissions:
      - aiplatform.modelArmorTemplates.create
      - aiplatform.modelArmorTemplates.get
      - aiplatform.modelArmorTemplates.update
      - aiplatform.modelArmorTemplates.delete
requirements:
  roles:
    - level: project
      role: roles/modelarmor.admin
    - level: project
      role: roles/iam.serviceAccountUser
    - level: project
      role: roles/iam.operationViewer
